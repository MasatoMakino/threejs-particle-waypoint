name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g., v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
      commit_sha: ${{ steps.resolve_tag.outputs.sha }}
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG (expected v*.*.* pattern)"
            exit 1
          fi

      - name: Verify tag exists and resolve commit SHA
        id: resolve_tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          TAG_SHA=$(gh api "repos/${REPO}/commits/${TAG}" --jq '.sha' 2>/dev/null) || {
            echo "::error::Tag $TAG does not exist in repository"
            exit 1
          }
          echo "Tag $TAG exists at commit $TAG_SHA"
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub Release is published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          RELEASE_INFO=$(gh api "repos/${REPO}/releases/tags/${TAG}" \
            --jq '{draft: .draft, name: .name}' 2>&1) || {
            echo "::error::No GitHub Release found for tag $TAG"
            exit 1
          }
          IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.draft')
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::Release for $TAG is still a draft"
            exit 1
          fi
          RELEASE_NAME=$(echo "$RELEASE_INFO" | jq -r '.name')
          echo "Release verified: $RELEASE_NAME"

      - name: Extract version from tag
        id: extract
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="$TAG"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    runs-on: ubuntu-22.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Verify package.json version matches tag
        env:
          TAG_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version match: $PKG_VERSION"

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g "npm@^11.10.0"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run buildTS

      - name: Publish to npm
        run: npm publish --access public --provenance
